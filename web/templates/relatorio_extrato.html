<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.4;
            color: #000;
            background: #fff;
        }
        
        @media print {
            .no-print {
                display: none;
            }
            body {
                background: white;
            }
            .page-break {
                page-break-after: always;
            }
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            border-bottom: 2px solid #000;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        
        .header h1 {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .info-section {
            margin-bottom: 20px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 10px;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        
        .info-label {
            font-weight: bold;
        }
        
        .extrato-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        
        .extrato-table thead {
            border-top: 2px solid #000;
            border-bottom: 2px solid #000;
        }
        
        .extrato-table th {
            text-align: left;
            padding: 8px 5px;
            font-weight: bold;
            font-size: 11px;
        }
        
        .extrato-table td {
            padding: 6px 5px;
            border-bottom: 1px solid #ddd;
            font-size: 11px;
        }
        
        .extrato-table tbody tr:hover {
            background-color: #f5f5f5;
        }
        
        .tipo-entrada {
            color: #000;
        }
        
        .tipo-saida {
            color: #000;
        }
        
        .valor-entrada {
            text-align: right;
            color: #000;
        }
        
        .valor-saida {
            text-align: right;
            color: #000;
        }
        
        .totais {
            border-top: 2px solid #000;
            margin-top: 10px;
            padding-top: 10px;
        }
        
        .total-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .total-final {
            font-size: 14px;
            border-top: 2px solid #000;
            padding-top: 10px;
            margin-top: 10px;
        }
        
        .footer {
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid #ccc;
            text-align: center;
            font-size: 10px;
            color: #666;
        }
        
        .no-print {
            background: #f0f0f0;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        
        .btn {
            display: inline-block;
            padding: 8px 16px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            margin-right: 10px;
            cursor: pointer;
            border: none;
            font-size: 12px;
        }
        
        .btn:hover {
            background: #0056b3;
        }
        
        .btn-print {
            background: #28a745;
        }
        
        .btn-print:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <div class="no-print">
        <div class="container">
            <div style="text-align: right;">
                <button onclick="window.print()" class="btn btn-print">🖨️ Imprimir</button>
                <a href="/caixas/{{.caixaID}}/relatorio" class="btn">📊 Relatório Completo</a>
                <a href="/caixas" class="btn">← Voltar</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <h1>EXTRATO DE CAIXA</h1>
            <div id="dataRelatorio"></div>
        </div>

        <div id="extratoContent">
            <p style="text-align: center; padding: 20px;">Carregando...</p>
        </div>
    </div>

    <script>
        const API_BASE = '/api/v1';
        const caixaID = '{{.caixaID}}';

        function getToken() {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (!cookie) continue;
                const parts = cookie.split('=');
                if (parts.length >= 2) {
                    const name = parts[0].trim();
                    let value = parts.slice(1).join('=');
                    try {
                        value = decodeURIComponent(value);
                    } catch (e) {
                        // Se falhar, usar o valor original
                    }
                    if (name === 'auth_token') {
                        return value;
                    }
                }
            }
            return null;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return day + '/' + month + '/' + year + ' ' + hours + ':' + minutes;
        }

        function formatCurrency(value) {
            return parseFloat(value).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        }

        async function loadExtrato() {
            const token = getToken();
            if (!token) {
                document.getElementById('extratoContent').innerHTML = '<p style="color: red;">Erro: Token não encontrado. Faça login novamente.</p>';
                return;
            }

            try {
                const response = await fetch(API_BASE + '/caixas/' + caixaID, {
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include'
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'Erro ao carregar extrato');
                }

                const data = await response.json();
                if (data.success && data.data) {
                    renderExtrato(data.data);
                } else {
                    throw new Error('Dados inválidos na resposta');
                }
            } catch (error) {
                console.error('Erro ao carregar extrato:', error);
                document.getElementById('extratoContent').innerHTML = '<p style="color: red;">Erro ao carregar extrato: ' + error.message + '</p>';
            }
        }

        function renderExtrato(data) {
            const caixa = data.caixa;
            const movimentacoes = data.movimentacoes || [];
            const totalEntradas = data.total_entradas || 0;
            const totalSaidas = data.total_saidas || 0;
            const saldo = data.saldo_atual || 0;

            // Data do relatório
            const dataRelatorio = new Date().toLocaleDateString('pt-BR', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
            document.getElementById('dataRelatorio').textContent = 'Emitido em: ' + dataRelatorio;

            let html = '';

            // Informações do Caixa
            html += '<div class="info-section">';
            html += '<div class="info-row"><span class="info-label">Caixa Nº:</span><span>' + caixa.id + '</span></div>';
            html += '<div class="info-row"><span class="info-label">Status:</span><span>' + (caixa.status === 'aberto' ? 'ABERTO' : 'FECHADO') + '</span></div>';
            html += '<div class="info-row"><span class="info-label">Data de Abertura:</span><span>' + formatDate(caixa.data_abertura) + '</span></div>';
            if (caixa.data_fechamento) {
                html += '<div class="info-row"><span class="info-label">Data de Fechamento:</span><span>' + formatDate(caixa.data_fechamento) + '</span></div>';
            }
            html += '<div class="info-row"><span class="info-label">Valor de Abertura:</span><span>R$ ' + formatCurrency(caixa.valor_abertura) + '</span></div>';
            if (caixa.valor_fechamento) {
                html += '<div class="info-row"><span class="info-label">Valor de Fechamento:</span><span>R$ ' + formatCurrency(caixa.valor_fechamento) + '</span></div>';
            }
            html += '</div>';

            // Tabela de Movimentações
            html += '<table class="extrato-table">';
            html += '<thead>';
            html += '<tr>';
            html += '<th style="width: 80px;">Data/Hora</th>';
            html += '<th style="width: 60px;">Tipo</th>';
            html += '<th>Descrição</th>';
            html += '<th style="width: 100px; text-align: right;">Entrada</th>';
            html += '<th style="width: 100px; text-align: right;">Saída</th>';
            html += '<th style="width: 100px; text-align: right;">Saldo</th>';
            html += '</tr>';
            html += '</thead>';
            html += '<tbody>';

            let saldoAcumulado = parseFloat(caixa.valor_abertura);

            // Linha de abertura
            html += '<tr>';
            html += '<td>' + formatDate(caixa.data_abertura) + '</td>';
            html += '<td>-</td>';
            html += '<td><strong>SALDO INICIAL</strong></td>';
            html += '<td style="text-align: right;">R$ ' + formatCurrency(caixa.valor_abertura) + '</td>';
            html += '<td style="text-align: right;">-</td>';
            html += '<td style="text-align: right;"><strong>R$ ' + formatCurrency(saldoAcumulado) + '</strong></td>';
            html += '</tr>';

            // Movimentações
            for (let i = 0; i < movimentacoes.length; i++) {
                const mov = movimentacoes[i];
                const isEntrada = mov.tipo === 'entrada';
                
                if (isEntrada) {
                    saldoAcumulado += parseFloat(mov.valor);
                } else {
                    saldoAcumulado -= parseFloat(mov.valor);
                }

                html += '<tr>';
                html += '<td>' + formatDate(mov.created_at) + '</td>';
                html += '<td>' + (isEntrada ? 'ENT' : 'SAÍ') + '</td>';
                html += '<td>' + mov.descricao;
                if (mov.observacoes) {
                    html += '<br><small style="color: #666;">' + mov.observacoes + '</small>';
                }
                html += '</td>';
                html += '<td style="text-align: right;">' + (isEntrada ? 'R$ ' + formatCurrency(mov.valor) : '-') + '</td>';
                html += '<td style="text-align: right;">' + (!isEntrada ? 'R$ ' + formatCurrency(mov.valor) : '-') + '</td>';
                html += '<td style="text-align: right;"><strong>R$ ' + formatCurrency(saldoAcumulado) + '</strong></td>';
                html += '</tr>';
            }

            html += '</tbody>';
            html += '</table>';

            // Totais
            html += '<div class="totais">';
            html += '<div class="total-row">';
            html += '<span>Total de Entradas:</span>';
            html += '<span>R$ ' + formatCurrency(totalEntradas) + '</span>';
            html += '</div>';
            html += '<div class="total-row">';
            html += '<span>Total de Saídas:</span>';
            html += '<span>R$ ' + formatCurrency(totalSaidas) + '</span>';
            html += '</div>';
            html += '<div class="total-final">';
            html += '<div class="total-row">';
            html += '<span>SALDO FINAL:</span>';
            html += '<span>R$ ' + formatCurrency(saldo) + '</span>';
            html += '</div>';
            html += '</div>';
            html += '</div>';

            // Rodapé
            html += '<div class="footer">';
            html += '<p>Este documento foi gerado automaticamente pelo sistema.</p>';
            html += '<p>Caixa ID: ' + caixa.id + ' | Usuário ID: ' + (caixa.user_id || 'N/A') + '</p>';
            html += '</div>';

            document.getElementById('extratoContent').innerHTML = html;
        }

        // Carregar extrato quando a página carregar
        window.addEventListener('DOMContentLoaded', function() {
            loadExtrato();
        });
    </script>
</body>
</html>
