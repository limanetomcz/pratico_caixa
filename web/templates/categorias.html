<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/dashboard" class="flex-shrink-0 flex items-center">
                        <i class="fas fa-cash-register text-green-600 text-2xl mr-2"></i>
                        <span class="text-xl font-bold text-gray-800">Módulo Caixa</span>
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/dashboard" class="text-gray-700 hover:text-green-600">
                        <i class="fas fa-home mr-1"></i>Dashboard
                    </a>
                    <a href="/caixas" class="text-gray-700 hover:text-green-600">
                        <i class="fas fa-history mr-1"></i>Caixas
                    </a>
                    <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg transition">
                        <i class="fas fa-sign-out-alt mr-2"></i>Sair
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="bg-white rounded-lg shadow-lg">
            <div class="p-6 border-b border-gray-200">
                <div class="flex justify-between items-center">
                    <h2 class="text-2xl font-bold text-gray-800">
                        <i class="fas fa-tags mr-2"></i>Gerenciar Categorias
                    </h2>
                    <button onclick="openNovaCategoriaModal()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg transition">
                        <i class="fas fa-plus mr-2"></i>Nova Categoria
                    </button>
                </div>
            </div>
            <div class="p-6">
                <!-- Filtro por Tipo -->
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Filtrar por Tipo</label>
                    <select id="filtroTipo" onchange="filtrarCategorias()" class="w-full md:w-64 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent">
                        <option value="">Todos</option>
                        <option value="entrada">Entradas</option>
                        <option value="saida">Saídas</option>
                    </select>
                </div>

                <!-- Lista de Categorias -->
                <div id="categoriasList" class="space-y-4">
                    <p class="text-gray-500 text-center py-8">Carregando...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Nova/Editar Categoria -->
    <div id="categoriaModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 w-full max-w-md">
            <h3 id="modalTitle" class="text-xl font-bold mb-4">Nova Categoria</h3>
            <form id="categoriaForm" class="space-y-4">
                <input type="hidden" id="categoriaId">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Nome *</label>
                    <input type="text" id="categoriaNome" required class="w-full px-4 py-2 border rounded-lg" placeholder="Ex: Vendas, Despesas">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Tipo *</label>
                    <select id="categoriaTipo" required class="w-full px-4 py-2 border rounded-lg">
                        <option value="">Selecione...</option>
                        <option value="entrada">Entrada</option>
                        <option value="saida">Saída</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Descrição</label>
                    <textarea id="categoriaDescricao" class="w-full px-4 py-2 border rounded-lg" rows="3" placeholder="Descrição opcional"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Cor</label>
                        <input type="color" id="categoriaCor" value="#3B82F6" class="w-full h-10 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Ícone (FontAwesome)</label>
                        <input type="text" id="categoriaIcone" class="w-full px-4 py-2 border rounded-lg" placeholder="fa-shopping-cart">
                        <p class="text-xs text-gray-500 mt-1">Ex: fa-shopping-cart, fa-money-bill</p>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Ordem</label>
                    <input type="number" id="categoriaOrdem" value="0" min="0" class="w-full px-4 py-2 border rounded-lg">
                </div>
                <div class="flex items-center">
                    <input type="checkbox" id="categoriaAtivo" checked class="mr-2">
                    <label for="categoriaAtivo" class="text-sm text-gray-700">Ativo</label>
                </div>
                <div class="flex space-x-4">
                    <button type="submit" class="flex-1 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg">
                        Salvar
                    </button>
                    <button type="button" onclick="closeCategoriaModal()" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded-lg">
                        Cancelar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = '/api/v1';
        let categorias = [];
        let filtroTipoAtual = '';

        function getToken() {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (!cookie) continue;
                const parts = cookie.split('=');
                if (parts.length >= 2) {
                    const name = parts[0].trim();
                    let value = parts.slice(1).join('=');
                    try {
                        value = decodeURIComponent(value);
                    } catch (e) {
                        // Se falhar, usar o valor original
                    }
                    if (name === 'auth_token') {
                        return value;
                    }
                }
            }
            return null;
        }

        async function loadCategorias() {
            const token = getToken();
            if (!token) {
                document.getElementById('categoriasList').innerHTML = '<p class="text-red-500">Erro: Token não encontrado. Faça login novamente.</p>';
                return;
            }

            try {
                let url = API_BASE + '/categorias';
                if (filtroTipoAtual) {
                    url += '?tipo=' + filtroTipoAtual;
                }

                const response = await fetch(url, {
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Accept': 'application/json'
                    },
                    credentials: 'include'
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'Erro ao carregar categorias');
                }

                const data = await response.json();
                if (data.success) {
                    categorias = data.data || [];
                    displayCategorias();
                } else {
                    throw new Error('Dados inválidos na resposta');
                }
            } catch (error) {
                console.error('Erro ao carregar categorias:', error);
                document.getElementById('categoriasList').innerHTML = '<p class="text-red-500">Erro ao carregar categorias: ' + error.message + '</p>';
            }
        }

        function filtrarCategorias() {
            filtroTipoAtual = document.getElementById('filtroTipo').value;
            loadCategorias();
        }

        function displayCategorias() {
            const container = document.getElementById('categoriasList');
            
            if (categorias.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center py-8">Nenhuma categoria encontrada. Crie uma nova categoria para começar.</p>';
                return;
            }

            // Separar por tipo
            const entradas = categorias.filter(c => c.tipo === 'entrada');
            const saidas = categorias.filter(c => c.tipo === 'saida');

            let html = '';

            // Categorias de Entrada
            if (entradas.length > 0) {
                html += '<div class="mb-8">';
                html += '<h3 class="text-lg font-semibold text-green-600 mb-4"><i class="fas fa-arrow-down mr-2"></i>Entradas</h3>';
                html += '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">';
                for (let i = 0; i < entradas.length; i++) {
                    html += renderCategoria(entradas[i]);
                }
                html += '</div></div>';
            }

            // Categorias de Saída
            if (saidas.length > 0) {
                html += '<div class="mb-8">';
                html += '<h3 class="text-lg font-semibold text-red-600 mb-4"><i class="fas fa-arrow-up mr-2"></i>Saídas</h3>';
                html += '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">';
                for (let i = 0; i < saidas.length; i++) {
                    html += renderCategoria(saidas[i]);
                }
                html += '</div></div>';
            }

            container.innerHTML = html;
        }

        function renderCategoria(cat) {
            const corBg = cat.cor || '#3B82F6';
            const icone = cat.icone ? 'fas ' + cat.icone : (cat.tipo === 'entrada' ? 'fas fa-arrow-down' : 'fas fa-arrow-up');
            const statusBadge = cat.ativo ? 
                '<span class="px-2 py-1 bg-green-100 text-green-800 text-xs rounded-full">Ativo</span>' :
                '<span class="px-2 py-1 bg-gray-100 text-gray-800 text-xs rounded-full">Inativo</span>';

            return '<div class="border rounded-lg p-4 hover:shadow-md transition">' +
                '<div class="flex items-start justify-between mb-3">' +
                    '<div class="flex items-center space-x-2">' +
                        '<div class="w-10 h-10 rounded-full flex items-center justify-center" style="background-color: ' + corBg + '20; color: ' + corBg + ';">' +
                            '<i class="' + icone + '"></i>' +
                        '</div>' +
                        '<div>' +
                            '<h4 class="font-semibold text-gray-800">' + cat.nome + '</h4>' +
                            '<p class="text-xs text-gray-500">Ordem: ' + (cat.ordem || 0) + '</p>' +
                        '</div>' +
                    '</div>' +
                    statusBadge +
                '</div>' +
                (cat.descricao ? '<p class="text-sm text-gray-600 mb-3">' + cat.descricao + '</p>' : '') +
                '<div class="flex space-x-2">' +
                    '<button onclick="editarCategoria(' + cat.id + ')" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white px-3 py-2 rounded text-sm transition">' +
                        '<i class="fas fa-edit mr-1"></i>Editar' +
                    '</button>' +
                    '<button onclick="deletarCategoria(' + cat.id + ')" class="flex-1 bg-red-500 hover:bg-red-600 text-white px-3 py-2 rounded text-sm transition">' +
                        '<i class="fas fa-trash mr-1"></i>Deletar' +
                    '</button>' +
                '</div>' +
            '</div>';
        }

        function openNovaCategoriaModal() {
            document.getElementById('modalTitle').textContent = 'Nova Categoria';
            document.getElementById('categoriaForm').reset();
            document.getElementById('categoriaId').value = '';
            document.getElementById('categoriaCor').value = '#3B82F6';
            document.getElementById('categoriaAtivo').checked = true;
            document.getElementById('categoriaModal').classList.remove('hidden');
        }

        function editarCategoria(id) {
            const categoria = categorias.find(c => c.id === id);
            if (!categoria) return;

            document.getElementById('modalTitle').textContent = 'Editar Categoria';
            document.getElementById('categoriaId').value = categoria.id;
            document.getElementById('categoriaNome').value = categoria.nome;
            document.getElementById('categoriaTipo').value = categoria.tipo;
            document.getElementById('categoriaDescricao').value = categoria.descricao || '';
            document.getElementById('categoriaCor').value = categoria.cor || '#3B82F6';
            document.getElementById('categoriaIcone').value = categoria.icone || '';
            document.getElementById('categoriaOrdem').value = categoria.ordem || 0;
            document.getElementById('categoriaAtivo').checked = categoria.ativo !== false;
            document.getElementById('categoriaModal').classList.remove('hidden');
        }

        function closeCategoriaModal() {
            document.getElementById('categoriaModal').classList.add('hidden');
            document.getElementById('categoriaForm').reset();
        }

        async function deletarCategoria(id) {
            if (!confirm('Tem certeza que deseja deletar esta categoria?')) {
                return;
            }

            const token = getToken();
            if (!token) {
                alert('Token não encontrado');
                return;
            }

            try {
                const response = await fetch(API_BASE + '/categorias/' + id, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Accept': 'application/json'
                    },
                    credentials: 'include'
                });

                const data = await response.json();
                if (response.ok && data.success) {
                    alert(data.message || 'Categoria deletada com sucesso');
                    loadCategorias();
                } else {
                    alert(data.message || 'Erro ao deletar categoria');
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao deletar categoria');
            }
        }

        document.getElementById('categoriaForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const token = getToken();
            if (!token) {
                alert('Token não encontrado');
                return;
            }

            const categoriaId = document.getElementById('categoriaId').value;
            const isEdit = categoriaId !== '';

            const formData = {
                nome: document.getElementById('categoriaNome').value,
                tipo: document.getElementById('categoriaTipo').value,
                descricao: document.getElementById('categoriaDescricao').value,
                cor: document.getElementById('categoriaCor').value,
                icone: document.getElementById('categoriaIcone').value,
                ordem: parseInt(document.getElementById('categoriaOrdem').value) || 0,
                ativo: document.getElementById('categoriaAtivo').checked
            };

            try {
                let url = API_BASE + '/categorias';
                let method = 'POST';

                if (isEdit) {
                    url += '/' + categoriaId;
                    method = 'PUT';
                }

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify(formData)
                });

                const data = await response.json();
                if (response.ok && data.success) {
                    alert(data.message || (isEdit ? 'Categoria atualizada com sucesso' : 'Categoria criada com sucesso'));
                    closeCategoriaModal();
                    loadCategorias();
                } else {
                    alert(data.message || 'Erro ao salvar categoria');
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao salvar categoria');
            }
        });

        function logout() {
            document.cookie = 'auth_token=; path=/; max-age=0';
            window.location.href = '/login';
        }

        // Carregar categorias ao carregar a página
        window.addEventListener('DOMContentLoaded', function() {
            loadCategorias();
        });
    </script>
</body>
</html>
