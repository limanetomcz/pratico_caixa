<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-green-50 to-emerald-100 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-green-600 rounded-full mb-4">
                <i class="fas fa-cash-register text-white text-2xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Módulo Caixa</h1>
            <p class="text-gray-600">Faça login para continuar</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-envelope mr-2"></i>Email
                </label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition"
                    placeholder="seu@email.com"
                >
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-lock mr-2"></i>Senha
                </label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition"
                    placeholder="••••••••"
                >
            </div>

            <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg"></div>

            <button 
                type="submit"
                class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 transform hover:scale-105"
            >
                <i class="fas fa-sign-in-alt mr-2"></i>Entrar
            </button>
        </form>
    </div>

    <script>
        // Verificar se há parâmetros de erro na URL ao carregar a página
        window.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const error = urlParams.get('error');
            const expired = urlParams.get('expired');
            
            const errorDiv = document.getElementById('errorMessage');
            
            // Só mostrar mensagem de erro se houver parâmetro na URL
            if (error || expired) {
                if (expired) {
                    errorDiv.textContent = 'Sua sessão expirou. Por favor, faça login novamente.';
                } else if (error) {
                    errorDiv.textContent = decodeURIComponent(error);
                }
                errorDiv.classList.remove('hidden');
                
                // Limpar parâmetros da URL para não mostrar a mensagem novamente ao recarregar
                const newUrl = window.location.pathname;
                window.history.replaceState({}, document.title, newUrl);
            }
        });
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            
            const authUrl = window.location.origin.includes('localhost') 
                ? 'http://localhost:9282' 
                : window.location.origin.replace(window.location.port, '9282');
            
            try {
                const response = await fetch(authUrl + '/api/v1/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email: email, password: password }),
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    const token = data.data.access_token;
                    // Salvar cookie com todas as opções necessárias
                    const cookieString = 'auth_token=' + encodeURIComponent(token) + 
                        '; path=/' + 
                        '; max-age=86400' + 
                        '; SameSite=Lax';
                    document.cookie = cookieString;
                    console.log('Cookie salvo:', cookieString.substring(0, 50) + '...');
                    // Pequeno delay para garantir que o cookie foi salvo
                    setTimeout(function() {
                        window.location.href = '/dashboard';
                    }, 100);
                } else {
                    errorDiv.textContent = data.message || 'Erro ao fazer login';
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                errorDiv.textContent = 'Erro de conexão. Verifique se o módulo Auth está rodando.';
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
